interface:
  display_name: "Amazon Listing 隐性减分体检"
  short_description: "全品类官方规则底线+隐性减分；合规后按 Rufus/COSMO 优化，块外写思考、块内纯粘贴"
  brand_color: "#FF9900"
  default_prompt: "Use $amazon-listing-penalty-audit to audit my Amazon ASIN against the latest Seller Central listing rules first, then the 7 silent penalties plus extra items. Apply the matching category overlay; do not reuse another product's specs. Distinguish Lightning Deals from list-price edits. Put the why (policy + COSMO relation or Rufus-citable fact, not A9 stuffing) outside the code block. Inside the code block, give Seller Central copy only. Do not label headings as paste-ready. Include gallery ALT and every A+ image ALT for every variant. Do not put warranty or guarantee in title, bullets, images, or search terms."
